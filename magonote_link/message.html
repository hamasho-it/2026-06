<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メッセージ画面 - マゴノテlink</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <header>
        <a href="./contact_list.html"><img src="./images/icon_home.png" alt="戻る" class="icon-header"></a>
        <h1>メッセージ画面</h1>
        <a href="./account.html"><img src="./images/icon_user.png" alt="アカウント" class="icon-header"></a>
    </header>
    <main>
        
        <h2 class="chat-title">○○さん</h2>
        <div class="chat-area">
            <div class="bubble bubble-receive">こんにちは</div>
            <div class="bubble bubble-send">よろしくお願いします</div>
        </div>
        <div class="chat-input">
            <img src="./images/icon_mic.png" alt="音声" class="icon-small">
            <img src="./images/icon_image.png" alt="画像" class="icon-small">
            <input type="text" placeholder="入力">
            <button class="btn-send"><img src="./images/icon_send.png" alt="送信" class="icon-small"></button>
        </div>
    
    </main>
    
</body>
</html>
