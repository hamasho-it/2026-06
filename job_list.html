<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マゴノテlink - 依頼一覧</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="./index.html" class="back-link">←</a>
      <div class="header-title">依頼一覧</div>
      <a href="./account.html"><img src="./images/icon_user.png" alt="アカウント" class="header-icon"></a>
    </header>
    <main class="app-content">
      <div class="search-container">
        <img src="./images/icon_search.png" alt="検索" class="icon-small">
        <input type="text" class="search-input" placeholder="検索">
        <img src="./images/icon_filter.png" alt="フィルター" class="icon-small" style="cursor: pointer;">
      </div>
      <a href="./apply.html" class="card">
        <div class="card-row">
          <span class="card-title">浜田市 草刈り</span>
          <span class="card-price">1,000円</span>
          <img src="./images/icon_heart.png" alt="お気に入り" class="heart-icon">
        </div>
      </a>
      <a href="./apply.html" class="card">
        <div class="card-row">
          <span class="card-title">サンプル町 清掃</span>
          <span class="card-price">1,200円</span>
          <img src="./images/icon_heart.png" alt="お気に入り" class="heart-icon">
        </div>
      </a>
      <a href="./apply.html" class="card">
        <div class="card-row">
          <span class="card-title">サンプル1丁目 落ち葉拾い</span>
          <span class="card-price">1,000円</span>
          <img src="./images/icon_heart.png" alt="お気に入り" class="heart-icon">
        </div>
      </a>
      <a href="./apply.html" class="card">
        <div class="card-row">
          <span class="card-title">サンプル町 庭の手入れ</span>
          <span class="card-price">1,500円</span>
          <img src="./images/icon_heart.png" alt="お気に入り" class="heart-icon">
        </div>
      </a>
    </main>
  </div>
  <script src="./script.js"></script>
</body>
</html>
