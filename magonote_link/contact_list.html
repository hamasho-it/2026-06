<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連絡画面 - マゴノテlink</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <header>
        <a href="./index.html"><img src="./images/icon_home.png" alt="ホーム" class="icon-header"></a>
        <h1>連絡画面</h1>
        <a href="./account.html"><img src="./images/icon_user.png" alt="アカウント" class="icon-header"></a>
    </header>
    <main>
        
        <div class="card contact-card" onclick="location.href='./message.html'">
            <div class="contact-info">
                <span class="status-online"></span>
                <h3>○○さん</h3>
            </div>
        </div>
        <div class="card contact-card" onclick="location.href='./message.html'">
            <div class="contact-info">
                <span class="status-offline"></span>
                <h3>△△さん</h3>
            </div>
        </div>
        <div class="card contact-card" onclick="location.href='./message.html'">
            <div class="contact-info">
                <span class="status-offline"></span>
                <h3>□□さん</h3>
            </div>
        </div>
    
    </main>
    
</body>
</html>
