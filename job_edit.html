<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マゴノテlink - 依頼編集画面</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="./job_manage.html" class="back-link">←</a>
      <div class="header-title">依頼編集画面</div>
      <a href="./account.html"><img src="./images/icon_user.png" alt="アカウント" class="header-icon"></a>
    </header>
    <main class="app-content">
      <div class="detail-list">
        <div class="detail-item">
          <span class="detail-label">時給</span>
          <div class="detail-value">
            <span>1,000円</span>
            <img src="./images/icon_edit.png" alt="編集" class="edit-icon">
          </div>
        </div>
        <div class="detail-item">
          <span class="detail-label">作業内容</span>
          <div class="detail-value">
            <span>草刈り</span>
            <img src="./images/icon_edit.png" alt="編集" class="edit-icon">
          </div>
        </div>
        <div class="detail-item">
          <span class="detail-label">指定時間</span>
          <div class="detail-value">
            <span>なし</span>
            <img src="./images/icon_edit.png" alt="編集" class="edit-icon">
          </div>
        </div>
        <div class="detail-item">
          <span class="detail-label">作業場所</span>
          <div class="detail-value">
            <span>浜田市○○町○-○</span>
            <img src="./images/icon_edit.png" alt="編集" class="edit-icon">
          </div>
        </div>
        <div class="detail-item">
          <span class="detail-label">支払方法</span>
          <div class="detail-value">
            <span>現金</span>
            <img src="./images/icon_edit.png" alt="編集" class="edit-icon">
          </div>
        </div>
      </div>
      <div class="map-container">
        <img src="./images/map_sample.png" alt="マップ" class="map-image">
      </div>
      <a href="./job_manage.html" class="btn btn-action" onclick="alert('編集を確定しました');">編集を確定する</a>
    </main>
  </div>
  <script src="./script.js"></script>
</body>
</html>
