<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>依頼内容作成 - マゴノテlink</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <header>
        <a href="./job_manage.html"><img src="./images/icon_home.png" alt="戻る" class="icon-header"></a>
        <h1>依頼内容作成</h1>
        <a href="./account.html"><img src="./images/icon_user.png" alt="アカウント" class="icon-header"></a>
    </header>
    <main>
        
        <form class="edit-form">
            <label>時給: <input type="text" placeholder="1,000円"></label>
            <label>作業内容: <input type="text" placeholder="草刈り"></label>
            <label>指定時間: <input type="text" placeholder="なし"></label>
            <label>作業場所: <input type="text" placeholder="サンプル県サンプル市サンプル町1-1"></label>
            <label>支払方法: <input type="text" placeholder="現金"></label>
        </form>
        <div class="map-area">
            <img src="./images/map_sample.png" alt="マップ">
        </div>
        <button onclick="alert('作成完了後'); location.href='./index.html'" class="btn-primary">依頼を決定する</button>
    
    </main>
    
</body>
</html>
