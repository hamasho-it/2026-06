<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マゴノテlink - 依頼内容作成</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="./job_manage.html" class="back-link">←</a>
      <div class="header-title">依頼内容作成</div>
      <a href="./account.html"><img src="./images/icon_user.png" alt="アカウント" class="header-icon"></a>
    </header>
    <main class="app-content">
      <div class="detail-list">
        <div class="detail-item">
          <span class="detail-label">時給</span>
          <input type="text" class="input-field" placeholder="1,000円">
        </div>
        <div class="detail-item">
          <span class="detail-label">作業内容</span>
          <input type="text" class="input-field" placeholder="草刈り">
        </div>
        <div class="detail-item">
          <span class="detail-label">指定時間</span>
          <input type="text" class="input-field" placeholder="なし">
        </div>
        <div class="detail-item">
          <span class="detail-label">作業場所</span>
          <input type="text" class="input-field" placeholder="浜田市○○町○-○">
        </div>
        <div class="detail-item">
          <span class="detail-label">支払方法</span>
          <input type="text" class="input-field" placeholder="現金">
        </div>
      </div>
      <div class="map-container">
        <img src="./images/map_sample.png" alt="マップ" class="map-image">
      </div>
      <a href="./index.html" class="btn btn-action" onclick="alert('依頼を作成しました');">依頼を決定する</a>
    </main>
  </div>
  <script src="./script.js"></script>
</body>
</html>
