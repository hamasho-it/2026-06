<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マゴノテlink - メッセージ画面</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="./contact_list.html" class="back-link">←</a>
      <div class="header-title">○○さん</div>
      <a href="./account.html"><img src="./images/icon_user.png" alt="アカウント" class="header-icon"></a>
    </header>
    <main class="app-content" style="padding-bottom: 70px;">
      <div class="chat-container">
        <div style="display: flex; align-items: flex-start; gap: 8px;">
          <img src="./images/icon_user.png" alt="相手" class="icon-small" style="border-radius: 50%;">
          <div class="chat-bubble chat-bubble-received">こんにちは</div>
        </div>
        <div class="chat-bubble chat-bubble-sent">こんにちは</div>
      </div>
    </main>
    <div class="message-input-bar">
      <a href="./contact_list.html" class="back-link" style="font-size: 20px;">←</a>
      <img src="./images/icon_mic.png" alt="音声" class="icon-small" style="cursor: pointer;">
      <img src="./images/icon_image.png" alt="画像" class="icon-small" style="cursor: pointer;">
      <input type="text" class="message-input" placeholder="入力">
      <button type="button" class="send-btn">
        <img src="./images/icon_send.png" alt="送信" class="icon-small">
      </button>
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
