<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マゴノテlink - アカウント設定画面</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="./index.html"><img src="./images/icon_home.png" alt="ホーム" class="header-icon"></a>
      <div class="header-title">アカウント画面</div>
      <a href="./account.html"><img src="./images/icon_user.png" alt="アカウント" class="header-icon"></a>
    </header>
    <main class="app-content">
      <div style="text-align: center; margin: 20px 0; position: relative;">
        <img src="./images/icon_user.png" alt="プロフィール" style="width: 80px; height: 80px; border-radius: 50%; background-color: #e5e5ea;">
        <img src="./images/icon_edit.png" alt="編集" class="edit-icon" style="position: absolute; bottom: 0; right: 35%;">
      </div>
      <div class="detail-list">
        <div class="detail-item">
          <span class="detail-label">名前</span>
          <div class="detail-value">
            <span>利用者A</span>
            <img src="./images/icon_edit.png" alt="編集" class="edit-icon">
          </div>
        </div>
        <div class="detail-item">
          <span class="detail-label">メールアドレス</span>
          <div class="detail-value">
            <span>sample@example.com</span>
            <img src="./images/icon_edit.png" alt="編集" class="edit-icon">
          </div>
        </div>
        <div class="detail-item">
          <span class="detail-label">年齢</span>
          <div class="detail-value">
            <span>17歳</span>
            <img src="./images/icon_edit.png" alt="編集" class="edit-icon">
          </div>
        </div>
        <div class="detail-item">
          <span class="detail-label">パスワード</span>
          <div class="detail-value">
            <span>••••••••</span>
            <img src="./images/icon_edit.png" alt="編集" class="edit-icon">
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="./script.js"></script>
</body>
</html>
